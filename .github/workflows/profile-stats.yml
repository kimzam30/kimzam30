name: Refresh profile stats

on:
  schedule:
    # 02:00 UTC every Monday
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate stat cards
        env:
          # STATS_TOKEN is a classic PAT with `repo` + `read:user`, which lets the
          # cards count private repositories and private contributions. Without it
          # the job falls back to GITHUB_TOKEN and reports public data only.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
          STATS_INCLUDE_PRIVATE: 'true'
        run: node .github/scripts/generate-stats.mjs

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/
          git diff --staged --quiet || git commit -m 'Refresh profile stat cards'
          git push
